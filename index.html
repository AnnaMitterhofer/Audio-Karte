<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meine Nachricht</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
    }

    .logo {
      max-width: 400px;
      max-height: 120px;
      margin-bottom: 40px;
    }

    .play-button {
      font-size: 24px;
      padding: 14px 28px;
      border: none;
      border-radius: 50px;
      background: #000;
      color: white;
      cursor: pointer;
    }
   /*.foto { 
      max-width: 120px;
      margin-left: auto;
      margin-right: 0 } /*
    audio {
      display: none;
    }
    
  </style>
</head>

<body>
  <div class="container">

    <img src="logo.png" alt="Logo" class="logo">
<img src="IMG_2632.jpg" class="foto"> 
      
    <button class="play-button"
      onclick="document.getElementById('audio').play()">
      ▶ Nachricht anhören
    </button>

    <audio id="audio" preload="metadata">
      <source src="aufnahme.m4a" type="audio/mp4">
    </audio>

  </div>
</body>
</html>
